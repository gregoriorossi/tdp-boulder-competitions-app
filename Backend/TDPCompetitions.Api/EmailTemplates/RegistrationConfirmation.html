<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .email-container {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .content {
            background-color: #ffffff;
            padding: 30px 20px;
        }

        .footer {
            background-color: #f9f9f9;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #e0e0e0;
        }

            .footer a {
                color: #667eea;
                text-decoration: none;
            }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h3>Teste di Pietra</h3>
        </div>

        <div class="content">
            {{Body}}

            <p>
                Il team TDP
            </p>
        </div>

        <div class="footer">
            <p>&copy; 2026 A.S.D. Teste di Pietra. Tutti i diritti riservati.</p>
            <p><a href="mailto:info@testedipietra.it" rel="noopener">info@testedipietra.it</a></p>
        </div>
    </div>
</body>
</html>
