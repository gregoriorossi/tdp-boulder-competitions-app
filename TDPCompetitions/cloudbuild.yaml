steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west8-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/api:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west8-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/api:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tdp-competitions'
      - '--image'
      - 'europe-west8-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/api:latest'
      - '--region'
      - 'europe-west8'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'europe-west8-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/api:latest'